      if (p1.length < 2 || p2.length < 2) return 0;
      let d = (+p2[0]*60 + +p2[1]) - (+p1[0]*60 + +p1[1]);

      return isNaN(d) ? 0 : d;

    function loadInitialStore() {
      try {
        const raw = localStorage.getItem(STORE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && parsed.substations && Object.keys(parsed.substations).length) return parsed;
        }
      } catch {}
      const def = createDefaultSub();
      return { activeId: def.id, substations: { [def.id]: def } };
    }

    function calcDailyLoss(dateKey, allDays, mfOverrides) {
      const sorted = Object.keys(allDays || {}).sort();
      const cur = (allDays && allDays[dateKey]) || { finalReadings: {}, initialOverrides: {} };
      const rows = DAILY_LOSS_METERS.map(m => {
        const mf = (mfOverrides && mfOverrides[m.id]) ? Number(mfOverrides[m.id]) : m.mf;
        const manInit = cur.initialOverrides && cur.initialOverrides[m.id] != null ? Number(cur.initialOverrides[m.id]) : null;
        let prevFinal = null;
        if (manInit == null) {
          for (let i = sorted.length - 1; i >= 0; i--) {
            const dk = sorted[i];
            if (dk < dateKey && allDays[dk]?.finalReadings?.[m.id] != null) {
              prevFinal = Number(allDays[dk].finalReadings[m.id]);
              break;
            }
          }
        }
        const initialVal = manInit != null ? manInit : prevFinal;
        const finalVal = cur.finalReadings && cur.finalReadings[m.id] != null ? Number(cur.finalReadings[m.id]) : null;
        const diff = (initialVal != null && finalVal != null) ? (finalVal - initialVal) : null;
        const cons = diff != null ? diff * mf : null;
        return { meter: m, initialVal, manualInitial: manInit != null, finalVal, diff, mf, cons };
      });
      const c = {};
      rows.forEach(r => c[r.meter.id] = r.cons);
      const t1Out = (c.saphala != null && c.dfcc != null && c.sst != null) ? c.saphala + c.dfcc + c.sst : null;
      const t2Out = (c.pargaon != null && c.navghar != null) ? c.pargaon + c.navghar : null;
      const totalHv = (c.hv1 != null && c.hv2 != null) ? c.hv1 + c.hv2 : null;
      const totalLv = (c.lv1 != null && c.lv2 != null) ? c.lv1 + c.lv2 : null;
      const totalOg = (t1Out != null && t2Out != null) ? t1Out + t2Out : null;
      const pair = (label, a, b) => ({ label, diff: (a != null && b != null) ? a - b : null, pct: (a != null && b != null && a !== 0) ? ((a - b) / a) * 100 : null });
      const lossRows = [
        pair("H.V. VS L.V. SIDE (T/F 1)", c.hv1, c.lv1),
        pair("H.V. VS O/G FDR (T/F 1)", c.hv1, t1Out),
        pair("L.V. VS O/G FDR (T/F 1)", c.lv1, t1Out),
        pair("H.V. VS L.V. SIDE (T/F 2)", c.hv2, c.lv2),
        pair("H.V. VS O/G FDR (T/F 2)", c.hv2, t2Out),
        pair("L.V. VS O/G FDR (T/F 2)", c.lv2, t2Out),
        pair("INC. VS H.V. SIDE", c.inc, totalHv),
        pair("INC. VS O/G FDR", c.inc, totalOg),
        pair("INC. VS L.V. SIDE", c.inc, totalLv)
      ];
      return { rows, c, t1Out, t2Out, totalHv, totalLv, totalOg, lossRows };
    }

        try { return JSON.parse(localStorage.getItem(FB_CFG_KEY) || "null"); } catch { return null; }
      });
      const [fbUser, setFbUser] = useState(null);
      const [syncStatus, setSyncStatus] = useState("लोकल मोड (Firebase जोडलेले नाही)");
      const fbRef = useRef({ db: null, auth: null, unsubSnap: null, unsubAuth: null, suppressPush: false });

      const notify = (msg) => { setToast(msg); setTimeout(() => setToast(""), 2600); };

      useEffect(() => {
        document.body.classList.toggle("dark", dark);
        localStorage.setItem("msedcl_dark", dark ? "1" : "0");
      }, [dark]);

      // Connect Firebase if configured
      useEffect(() => {
        if (!fbCfg || !fbCfg.apiKey || !fbCfg.projectId) {
          setSyncStatus("ऑफलाईन / लोकल स्टोरेज");
          return;
        }
        const setup = async () => {
          const sdk = window.__FB_SDK__;
          if (!sdk) return;
          try {
            if (fbRef.current.unsubSnap) fbRef.current.unsubSnap();
            if (fbRef.current.unsubAuth) fbRef.current.unsubAuth();
            for (const a of sdk.getApps()) { await sdk.deleteApp(a); }
            const app = sdk.initializeApp(fbCfg);
            const db = sdk.getFirestore(app);
            const auth = sdk.getAuth(app);
            fbRef.current.db = db;
            fbRef.current.auth = auth;
            setSyncStatus("Firebase तयार — साइन-इन करा");
            fbRef.current.unsubAuth = sdk.onAuthStateChanged(auth, (user) => {
              setFbUser(user);
              if (fbRef.current.unsubSnap) { fbRef.current.unsubSnap(); fbRef.current.unsubSnap = null; }
              if (user) {
                setSyncStatus("☁️ रिअल-टाइम सिंक चालू");
                const userDoc = sdk.doc(db, "users", user.uid, "portal", "state");
                fbRef.current.unsubSnap = sdk.onSnapshot(userDoc, (snap) => {
                  if (snap.exists() && snap.data()?.storeJson) {
                    try {
                      const remote = JSON.parse(snap.data().storeJson);
                      fbRef.current.suppressPush = true;
                      setStore(remote);
                      localStorage.setItem(STORE_KEY, JSON.stringify(remote));
                      setTimeout(() => { fbRef.current.suppressPush = false; }, 300);
                    } catch {}
                  }
                }, () => setSyncStatus("⚠️ Firestore Rules तपासा"));
              } else {
                setSyncStatus("Firebase तयार (साइन-इन करा)");
              }
            });
          } catch (err) {
            setSyncStatus("⚠️ Firebase Config त्रुटी");
          }
        };
        if (window.__FB_SDK__) setup();
        else window.addEventListener("fb-sdk-ready", setup, { once: true });
      }, [fbCfg]);

      const commitStore = (updater) => {
        setStore(prev => {
          const next = typeof updater === "function" ? updater(prev) : updater;
          try { localStorage.setItem(STORE_KEY, JSON.stringify(next)); } catch {}
          if (fbRef.current.db && fbUser && !fbRef.current.suppressPush) {
            const sdk = window.__FB_SDK__;
            sdk.setDoc(sdk.doc(fbRef.current.db, "users", fbUser.uid, "portal", "state"), {

                ]}
                items={activeSub.battery || []} editMode={editMode} onBack={() => setMod("home")}
                onAdd={(it) => { updateSub(s => ({ ...s, battery: [it, ...(s.battery || [])] })); notify("बॅटरी तपासणी सेव्ह झाली"); }}
                onDelete={(id) => updateSub(s => ({ ...s, battery: s.battery.filter(x => x.id !== id) }))}
              />
            )}
            {mod === "pdf_io" && (
              <PdfIoView
                sub={activeSub} lossHistory={mergedLoss} editMode={editMode} onBack={() => setMod("home")}

                onDeleteIo={(id) => updateSub(s => ({ ...s, io: s.io.filter(x => x.id !== id) }))}
              />
            )}
            {mod === "daily_loss" && (
              <DailyLossView
                sub={activeSub} editMode={editMode} onBack={() => setMod("home")}
                onSaveDay={(dateKey, finalReadings, initialOverrides) => {
                  updateSub(s => ({ ...s, dailyLosses: { ...(s.dailyLosses || {}), [dateKey]: { finalReadings, initialOverrides } } }));
                  notify(`${dateKey} दैनिक लॉस रीडिंग सेव्ह झाले`);
                }}
              />
            )}
            {mod === "minmax" && (
              <MinMaxView
                sub={activeSub} editMode={editMode} onBack={() => setMod("home")}
                onSaveDay={(dateKey, entries) => {
                  updateSub(s => ({ ...s, minmax: { ...(s.minmax || {}), [dateKey]: entries } }));
                  notify(`${dateKey} Min-Max नोंद सेव्ह झाली`);
                }}
              />
            )}
            {mod === "faults" && (
              <FaultsView
                sub={activeSub} editMode={editMode} onBack={() => setMod("home")}
                onAdd={(it) => { updateSub(s => ({ ...s, faults: [it, ...(s.faults || [])] })); notify("बिघाड नोंद सेव्ह झाली"); }}
                onUpdateStatus={(id, status) => updateSub(s => ({ ...s, faults: s.faults.map(x => x.id === id ? { ...x, status, restoredDate: todayIso() } : x) }))}
                onDelete={(id) => updateSub(s => ({ ...s, faults: s.faults.filter(x => x.id !== id) }))}
              />
            )}
          </main>

          {eqModal && (
            <EquipmentModal
              item={eqModal} editMode={editMode} onClose={() => setEqModal(null)}
              onSave={(updated) => {
                updateSub(s => ({ ...s, nameplates: (s.nameplates || []).map(x => x.id === updated.id ? updated : x) }));
                setEqModal(null); notify("नेमप्लेट अपडेट झाली");
              }}
            />
          )}

          {fbModal && (
            <FirebaseModal
              cfg={fbCfg} user={fbUser} syncStatus={syncStatus}
              onClose={() => setFbModal(false)}
              onSaveCfg={(c) => { localStorage.setItem(FB_CFG_KEY, JSON.stringify(c)); setFbCfg(c); notify("Firebase Config सेव्ह झाले"); }}
              onGoogleSignIn={async () => {
                const sdk = window.__FB_SDK__;
                if (!fbRef.current.auth) return notify("प्रथम Firebase Config सेव्ह करा");
                try { await sdk.signInWithPopup(fbRef.current.auth, new sdk.GoogleAuthProvider()); notify("Google साइन-इन यशस्वी!"); }
                catch (e) { notify("Sign-In त्रुटी: " + e.message); }
              }}
              onSignOut={async () => {
                if (fbRef.current.auth) await window.__FB_SDK__.signOut(fbRef.current.auth);
                notify("साइन आउट झाले");
              }}
            />
          )}

          {addSubModal && (
            <AddSubModal
              onClose={() => setAddSubModal(false)}
              onCreate={(name, code, division) => {
                const id = "sub_" + code.replace(/[^a-zA-Z0-9]/g, "") + "_" + Date.now();
                const created = createDefaultSub(id, name, code, division);
                commitStore(p => ({ activeId: id, substations: { ...p.substations, [id]: created } }));
                setAddSubModal(false); notify("नवीन उपकेंद्र तयार झाले");
              }}
            />
          )}

          {toast && <div className="toast">{toast}</div>}
        </div>
      );
    }

    function AnalyticsView({ lossHistory, editMode, onAddLoss, onBack }) {
      const [year, setYear] = useState(2026);
      const [monthIdx, setMonthIdx] = useState(9);
      const [inc, setInc] = useState("");
      const [out, setOut] = useState("");
      const feeders = RAW_SUMMARY.filter(x => x.year === year && x.monthIdx === monthIdx);
      const loss = lossHistory.find(x => x.year === year && x.monthIdx === monthIdx);
      const yearLosses = lossHistory.filter(x => x.year === year);
      const maxKwh = Math.max(...yearLosses.map(x => x.incomerKwh), 1);
      const pdfId = feeders.find(x => x.drivePdfId)?.drivePdfId;

      return (
        <div>
          <ModBar title="२. २०२४–२०२६ ॲनालिटिक्स व PDF" onBack={onBack} />
          <div className="card mb-3 row">
            {[2024, 2025, 2026].map(y => (
              <button key={y} className={`tab ${year === y ? "active" : ""}`} onClick={() => setYear(y)}>{y}</button>
            ))}
            <select style={{ width: 170 }} value={monthIdx} onChange={e => setMonthIdx(Number(e.target.value))}>
              {MONTHS.map((m, i) => <option key={m} value={i}>{m}</option>)}
            </select>
            {pdfId && (
              <a className="btn btn-primary btn-sm" href={`https://drive.google.com/file/d/${pdfId}/view`} target="_blank" rel="noreferrer">
                📄 Google Drive मूळ PDF पहा
              </a>
            )}
          </div>

          <div className="grid-4 mb-3">
            <div className="card"><div className="small muted">33kV इनकमर</div><div style={{ fontSize: 19, fontWeight: 800, color: "var(--primary)" }}>{fmtNum(loss?.incomerKwh)} kWh</div></div>
            <div className="card"><div className="small muted">11kV आउटगोइंग</div><div style={{ fontSize: 19, fontWeight: 800, color: "var(--green)" }}>{fmtNum(loss?.outgoingKwh)} kWh</div></div>
            <div className="card"><div className="small muted">लॉस %</div><div style={{ fontSize: 19, fontWeight: 800, color: "var(--amber)" }}>{loss ? `${loss.lossPct} %` : "N/A"}</div></div>
            <div className="card"><div className="small muted">एकूण ट्रिपिंग</div><div style={{ fontSize: 19, fontWeight: 800 }}>{feeders.reduce((a,b) => a + b.totalTripping, 0)}</div></div>
          </div>

          <div className="card mb-3">
            <div style={{ fontWeight: 800 }} className="mb-2">{year} मासिक इनकमर (kWh) बार चार्ट</div>
            <div style={{ display: "flex", alignItems: "flex-end", gap: 8, height: 140, paddingTop: 12 }}>
              {yearLosses.map(l => (
                <div key={l.monthIdx} style={{ flex: 1, textAlign: "center", cursor: "pointer" }} onClick={() => setMonthIdx(l.monthIdx)}>
                  <div style={{ height: `${Math.max(10, (l.incomerKwh / maxKwh) * 110)}px`, background: l.monthIdx === monthIdx ? "#d97706" : "#1d4ed8", borderRadius: "6px 6px 0 0" }} title={`${l.month}: ${fmtNum(l.incomerKwh)} kWh (${l.lossPct}%)`} />
                  <div className="small muted" style={{ fontSize: 10 }}>{l.month.slice(0,3)}</div>
                </div>
              ))}
            </div>
          </div>

          <div className="card mb-3">
            <div style={{ fontWeight: 800 }} className="mb-2">फिडरनिहाय कामगिरी — {MONTHS[monthIdx]} {year}</div>
            <div className="table-wrap">
              <table>
                <thead><tr><th>फिडर</th><th>TP</th><th>HT</th><th>SD</th><th>BD</th><th>LS</th><th>Total</th><th>Min</th><th>Max A</th><th>Min A</th></tr></thead>
                <tbody>
                  {feeders.length === 0 ? <tr><td colSpan="10">या महिन्याचा डेटा उपलब्ध नाही</td></tr> : feeders.map(f => (
                    <tr key={f.feederIdx}><td><b>{f.feeder}</b></td><td>{f.tp}</td><td>{f.ht}</td><td>{f.sd}</td><td>{f.bd}</td><td>{f.ls}</td><td><b>{f.totalTripping}</b></td><td>{f.durationMin}</td><td>{f.maxLoad}</td><td>{f.minLoad}</td></tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          {editMode && (
            <div className="card">
              <div style={{ fontWeight: 800 }} className="mb-2">{MONTHS[monthIdx]} {year} लॉस डेटा अपडेट / जोडा</div>
              <div className="grid-3">
                <div><label className="fl">33kV इनकमर (kWh)</label><input className="input" type="number" value={inc} onChange={e => setInc(e.target.value)} /></div>
                <div><label className="fl">11kV आउटगोइंग (kWh)</label><input className="input" type="number" value={out} onChange={e => setOut(e.target.value)} /></div>
                <div style={{ alignSelf: "end" }}>
                  <button className="btn btn-primary" style={{ width: "100%" }} onClick={() => {
                    const i = +inc, o = +out; if (!i) return;
                    onAddLoss({ year, monthIdx, month: MONTHS[monthIdx], incomerKwh: i, outgoingKwh: o, diffKwh: i - o, lossPct: Math.round(((i - o) / i) * 100000) / 1000 });
                    setInc(""); setOut("");
                  }}>सेव्ह करा</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

            <textarea rows="8" className="mono mb-3" value={jsonText} onChange={e => setJsonText(e.target.value)} />
            <div className="row between">
              <div className="row">
                <button className="btn btn-primary" onClick={() => {
                  try { onSaveCfg(JSON.parse(jsonText)); } catch { alert("कृपया वैध JSON पेस्ट करा."); }
                }}>Config सेव्ह करा</button>
                {!user ? (
                  <button className="btn btn-green" onClick={onGoogleSignIn}>Google ने साइन-इन करा</button>
                ) : (
                  <button className="btn btn-red" onClick={onSignOut}>साइन आउट ({user.email})</button>
                )}
              </div>
              <button className="btn" onClick={onClose}>बंद करा</button>
            </div>
          </div>
        </div>
      );
    }

    function AddSubModal({ onClose, onCreate }) {
      const [name, setName] = useState(""); const [code, setCode] = useState(""); const [div, setDiv] = useState("पालघर विभाग (MSEDCL)");
      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal-box" onClick={e => e.stopPropagation()}>
            <h3 className="mb-3">नवीन उपकेंद्र जोडा</h3>
            <div className="mb-2"><label className="fl">उपकेंद्राचे नाव *</label><input className="input" value={name} onChange={e => setName(e.target.value)} /></div>
            <div className="mb-2"><label className="fl">उपकेंद्र कोड *</label><input className="input" value={code} onChange={e => setCode(e.target.value)} /></div>
            <div className="mb-3"><label className="fl">शाखा / विभाग</label><input className="input" value={div} onChange={e => setDiv(e.target.value)} /></div>
            <div className="row between">
              <button className="btn" onClick={onClose}>रद्द</button>
              <button className="btn btn-primary" onClick={() => { if (name && code) onCreate(name, code, div); }}>तयार करा</button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
